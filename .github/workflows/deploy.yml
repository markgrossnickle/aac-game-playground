name: Deploy

# Runs only after CI succeeded on a push to main, and ships the exact files
# CI built and tested (the "site" artifact of that CI run):
#   1. check out that commit for the hosting check and verify scripts only
#      (no npm install, no build: no repository code runs next to the token),
#   2. prove the hosting is this bundle's own, fresh project (tools/check-hosting.mjs),
#   3. upload CI's "site" artifact as a production deployment (tools/vercel-upload.mjs),
#   4. verify the live site serves that buildId.
# Merging a PR is the only way to deploy; there is no manual trigger.
#
# Secrets (docs/SPINOFF.md):
#   environment "production": VERCEL_TOKEN, a token scoped to the web project only;
#   repository: VERCEL_ORG_ID, VERCEL_PROJECT_ID (identifiers, not credentials).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secrets
        id: secrets
        env:
          OK: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: echo "ok=$OK" >> "$GITHUB_OUTPUT"
      - name: Not configured
        if: steps.secrets.outputs.ok != 'true'
        run: echo "::notice::VERCEL_TOKEN (production environment) / VERCEL_ORG_ID / VERCEL_PROJECT_ID are not set; nothing deployed. See docs/SPINOFF.md."

      - name: Check out the commit CI tested (scripts only)
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version-file: html/.nvmrc

      - name: Hosting is this bundle's own fresh project
        if: steps.secrets.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node tools/check-hosting.mjs --project web

      - name: Fetch the files CI built and tested
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Upload exactly those files
        if: steps.secrets.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          BUILD_ID=$(node -p 'JSON.parse(require("fs").readFileSync("site/games-manifest.json","utf8")).buildId')
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Deploying build $BUILD_ID"
          node tools/vercel-upload.mjs --dir site --project-id "${{ secrets.VERCEL_PROJECT_ID }}"

      - name: Verify at the real URL
        if: steps.secrets.outputs.ok == 'true'
        run: bash tools/verify-live.sh "$BUILD_ID"
