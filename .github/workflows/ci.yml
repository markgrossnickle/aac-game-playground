name: CI

# Every PR and every push to main: config in sync, games conform, type check,
# build, then a scaffolded throwaway game proves the hub, service worker and
# update flow end to end in a muted headless browser.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint games and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: html/.nvmrc
      - name: bundle.config.json is applied everywhere
        run: node tools/sync-config.mjs --check
      - name: Game folders conform
        run: node tools/check-games.mjs
      - name: Game PRs stay inside their folder
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" || true
          node tools/check-pr-scope.mjs --base "origin/${PR_BASE_REF}"
      - name: No leftover placeholders or brand strings in the framework
        run: |
          set -e
          if grep -rIn --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
               -e "__GAME_ID__" -e "__GAME_TITLE__" html/src html/plugins html/index.html; then
            echo "placeholder tokens leaked into framework code"; exit 1; fi

  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: html/.nvmrc
          cache: npm
          cache-dependency-path: html/package-lock.json
      - run: npm ci
      - name: Type check and build (exactly what the deploy builds)
        run: npm run build
      - name: Record the build id
        run: node -p 'JSON.parse(require("fs").readFileSync("dist/games-manifest.json","utf8")).buildId'
      # deploy.yml rebuilds this exact commit and refuses to ship unless its
      # buildId matches this one, so what goes live is what was tested here.
      - name: Keep the build id for the deploy
        uses: actions/upload-artifact@v4
        with:
          name: build-id
          path: html/dist/games-manifest.json
          retention-days: 7
      - name: Scaffold a throwaway game so the pipeline is exercised even with no games committed
        if: ${{ !contains(github.head_ref, 'game/') }}
        run: |
          node scripts/new-game.mjs ci-smoke "CI Smoke" --author ci
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (headless, muted, offline round trip)
        run: npm run smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: html/test-results
          if-no-files-found: ignore
