name: Deploy

# Runs only after CI succeeded on a push to main, and deploys THAT commit:
#   1. check out the exact commit CI tested (workflow_run.head_sha),
#   2. prove the hosting is this bundle's own, fresh project (tools/check-hosting.mjs),
#   3. build with `vercel build` and require the same buildId CI produced,
#   4. upload exactly that build output (`vercel deploy --prebuilt`),
#   5. verify the live site serves that buildId.
# Merging a PR is the only way to deploy; there is no manual trigger.
#
# Secrets (docs/SPINOFF.md): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secrets
        id: secrets
        env:
          OK: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: echo "ok=$OK" >> "$GITHUB_OUTPUT"
      - name: Not configured
        if: steps.secrets.outputs.ok != 'true'
        run: echo "::notice::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are not set; nothing deployed. See docs/SPINOFF.md."

      - name: Check out the commit CI tested
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version-file: html/.nvmrc

      - name: Hosting is this bundle's own fresh project
        if: steps.secrets.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node tools/check-hosting.mjs --project web

      - name: Fetch the build id CI recorded
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-id
          path: ci-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Build exactly what CI built
        if: steps.secrets.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          CI_ID=$(node -p 'JSON.parse(require("fs").readFileSync("ci-build/games-manifest.json","utf8")).buildId')
          OUT_ID=$(node -p 'JSON.parse(require("fs").readFileSync(".vercel/output/static/games-manifest.json","utf8")).buildId')
          echo "CI buildId $CI_ID, deploy buildId $OUT_ID"
          [ "$CI_ID" = "$OUT_ID" ] || { echo "::error::the deploy build differs from the build CI tested"; exit 1; }
          echo "BUILD_ID=$OUT_ID" >> "$GITHUB_ENV"

      - name: Deploy that build
        if: steps.secrets.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify at the real URL
        if: steps.secrets.outputs.ok == 'true'
        run: bash tools/verify-live.sh "$BUILD_ID"
