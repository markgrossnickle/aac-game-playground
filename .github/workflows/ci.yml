name: CI

# ONE cheap job, on pull requests only (docs/CI-BUDGET.md): config in sync,
# games conform, the PR stays in scope, type check and build. About a minute on
# ubuntu-latest, no browser. The Playwright smoke and gameplay tests are the
# real gate and run on the author's machine before merging (headless, muted):
#   cd html && npm run build && npm run smoke
# The PR template records which local checks ran and their results.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: html/.nvmrc
          cache: npm
          cache-dependency-path: html/package-lock.json
      - name: bundle.config.json is applied everywhere
        run: node tools/sync-config.mjs --check
      - name: Game folders conform
        run: node tools/check-games.mjs
      - name: Game PRs stay inside their folder
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" || true
          node tools/check-pr-scope.mjs --base "origin/${PR_BASE_REF}"
      - name: No placeholder tokens leaked into framework code
        run: |
          if grep -rIn -e "__GAME_ID__" -e "__GAME_TITLE__" html/src html/plugins html/index.html; then
            echo "placeholder tokens leaked into framework code"; exit 1; fi
      - name: Type check and build
        working-directory: html
        run: |
          npm ci
          npm run build
