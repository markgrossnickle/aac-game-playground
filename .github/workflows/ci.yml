name: CI

# Every PR and every push to main: config in sync, games conform, type check,
# build, then a scaffolded throwaway game proves the hub, service worker and
# update flow end to end in a muted headless browser.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint games and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: html/.nvmrc
      - name: bundle.config.json is applied everywhere
        run: node tools/sync-config.mjs --check
      - name: Game folders conform
        run: node tools/check-games.mjs
      - name: Game PRs stay inside their folder
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" || true
          node tools/check-pr-scope.mjs --base "origin/${PR_BASE_REF}"
      - name: No leftover placeholders or brand strings in the framework
        run: |
          set -e
          if grep -rIn --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
               -e "__GAME_ID__" -e "__GAME_TITLE__" html/src html/plugins html/index.html; then
            echo "placeholder tokens leaked into framework code"; exit 1; fi

  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: html/.nvmrc
          cache: npm
          cache-dependency-path: html/package-lock.json
      - run: npm ci
      - name: Type check and build (exactly what the deploy builds)
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test the real build (headless, muted, offline round trip)
        run: npm run smoke
      # deploy.yml ships this exact folder, so what goes live is what was tested here.
      - name: Package the tested build for deployment
        run: node ../tools/make-site.mjs ../site
      - name: Keep the tested build for the deploy
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: false
          retention-days: 7
      - name: With no games committed, also exercise the pipeline on a throwaway game
        run: |
          if [ -n "$(find games -mindepth 1 -maxdepth 1 -type d ! -name '.*' -print -quit)" ]; then
            echo "games present; already tested above"; exit 0
          fi
          node scripts/new-game.mjs ci-smoke "CI Smoke" --author ci
          node scripts/new-game.mjs ci-smoke-aac "CI Smoke AAC" --author ci --aac 2>/dev/null || true
          npm run build
          npm run smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: html/test-results
          if-no-files-found: ignore
