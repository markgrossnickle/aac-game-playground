<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Bubble Pop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- bootGame() adds the Back link. Keep the top-left 92x60 px corner clear.
         The AAC chip sits in the bottom-left corner; keep that clear too. -->

    <canvas id="stage" aria-label="Bubbles"></canvas>

    <div class="hud">
      <div class="score" aria-live="polite"><span aria-hidden="true">🫧</span> <span id="score">0</span></div>
      <button id="mute-toggle" type="button" aria-pressed="false">
        <span class="mute-icon">🔊</span>
      </button>
    </div>
    <div id="heard" class="heard" aria-live="polite"></div>

    <div id="tray" class="tray" role="toolbar" aria-label="Bubble controls">
      <button class="ctl dot" data-colour="red" type="button" aria-label="red"></button>
      <button class="ctl dot" data-colour="blue" type="button" aria-label="blue"></button>
      <button class="ctl dot" data-colour="green" type="button" aria-label="green"></button>
      <button class="ctl dot" data-colour="yellow" type="button" aria-label="yellow"></button>
      <button id="more-btn" class="ctl" type="button" aria-label="more">➕</button>
      <button id="big-btn" class="ctl" type="button" aria-label="big"><span class="big-dot"></span></button>
      <button id="flow-btn" class="ctl" type="button" aria-label="stop">⏸</button>
      <button id="again-btn" class="ctl" type="button" aria-label="again">🔄</button>
    </div>

    <div id="start" class="overlay">
      <div class="overlay__card">
        <div class="overlay__title">🫧 Bubble Pop</div>
        <button id="start-btn" class="big" type="button">Go</button>
        <div id="best" class="best" hidden></div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
