<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APK host</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #0e1116; color: #e6edf3; font-family: system-ui, sans-serif; line-height: 1.5; }
      main { max-width: 460px; text-align: center; }
      a { color: #58a6ff; }
      code { font-family: ui-monospace, Menlo, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Installer host</h1>
      <p>This tiny project hosts only the Android installer, so it is stored once
        instead of being copied into every content deploy.</p>
      <p><a href="/games.apk"><code>/games.apk</code></a></p>
      <p>The install page lives on the main site at <code>/download</code>.</p>
    </main>
  </body>
</html>
