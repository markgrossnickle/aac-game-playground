name: Deploy

# Started by hand (docs/CI-BUDGET.md: deploys are manual), from main only:
#   gh workflow run deploy.yml -R <owner>/<repo>
# Run the local checks on main first (cd html && npm run build && npm run smoke).
#
# Two jobs so that no repository code ever runs while the token is loaded:
#   build   no secrets: npm ci, build, package html/dist as the "site" artifact.
#   deploy  production environment (token scoped to the web project only):
#           prove the hosting is this bundle's own fresh project, upload exactly
#           the build job's files through the Vercel API, verify the live buildId.
# About two minutes per deploy.
#
# Secrets (docs/SPINOFF.md): environment "production": VERCEL_TOKEN;
# repository: VERCEL_ORG_ID, VERCEL_PROJECT_ID.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-id: ${{ steps.pkg.outputs.build-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: html/.nvmrc
          cache: npm
          cache-dependency-path: html/package-lock.json
      - name: Config and games conform
        run: |
          node tools/sync-config.mjs --check
          node tools/check-games.mjs
      - name: Build
        working-directory: html
        run: |
          npm ci
          npm run build
      - name: Package the build
        id: pkg
        run: |
          node tools/make-site.mjs site
          echo "build-id=$(node -p 'JSON.parse(require("fs").readFileSync("site/games-manifest.json","utf8")).buildId')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Check secrets
        id: secrets
        env:
          OK: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: echo "ok=$OK" >> "$GITHUB_OUTPUT"
      - name: Not configured
        if: steps.secrets.outputs.ok != 'true'
        run: |
          echo "::error::VERCEL_TOKEN (production environment) / VERCEL_ORG_ID / VERCEL_PROJECT_ID are not set. See docs/SPINOFF.md."
          exit 1

      # Scripts only: check-hosting and verify-live have no dependencies and
      # live under CODEOWNERS-protected tools/. Nothing is installed or built here.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            bundle.config.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Hosting is this bundle's own fresh project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node tools/check-hosting.mjs --project web

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Upload exactly the build job's files
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node tools/vercel-upload.mjs --dir site --project-id "${{ secrets.VERCEL_PROJECT_ID }}"

      - name: Verify at the real URL
        run: bash tools/verify-live.sh "${{ needs.build.outputs.build-id }}"
